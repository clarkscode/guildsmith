[workspace]
resolver = "3"
members = [
    "crates/guildsmith-core",
    "crates/guildsmith-app",
    "crates/guildsmith-discord",
    "crates/guildsmith-mcp",
    "crates/guildsmith",
    "xtask",
]
default-members = ["crates/guildsmith"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/clarkscode/guildsmith"
homepage = "https://github.com/clarkscode/guildsmith"
authors = ["guildsmith contributors"]

[workspace.dependencies]
# Internal crates.
guildsmith-core = { path = "crates/guildsmith-core", version = "0.1.0" }
guildsmith-app = { path = "crates/guildsmith-app", version = "0.1.0" }
guildsmith-discord = { path = "crates/guildsmith-discord", version = "0.1.0" }
guildsmith-mcp = { path = "crates/guildsmith-mcp", version = "0.1.0" }

# Discord REST (research R2). rustls with webpki roots so musl builds are fully static.
twilight-http = { version = "0.17.1", default-features = false, features = ["rustls-webpki-roots", "decompression"] }
twilight-model = "0.17.1"
twilight-validate = "0.17.0"
# twilight leaves the TLS crypto provider to the application; ring builds on every target (incl. musl).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# MCP (research R3).
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "time", "sync"] }
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
schemars = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
blake3 = "1"
keyring = "4"

# Dev and test.
proptest = "1.12"
insta = "1.49"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allowed: doc sections for errors/panics are noise on internal APIs that return typed errors.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Allowed: crate-prefixed type names (e.g. `GuildSpec` in `spec`) read better at use sites.
module_name_repetitions = "allow"

[profile.release]
# Size over speed: guildsmith waits on the network, not the CPU. Measured: 8.4 → 6.1 MiB, same
# 7.7 ms cold start (constitution VI budget is < 10 MB).
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
