# Opt-in live tests (001 quickstart §1–§7, 002 quickstart §1–§5) against the dedicated Discord
# test servers.
# The secrets belong to a server created only for this; the destructive tests reset it.
name: Nightly live tests

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    environment: live-test-server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Live tests
        env:
          GUILDSMITH_LIVE_TEST: "1"
          GUILDSMITH_LIVE_DESTRUCTIVE: "1"
          DISCORD_TOKEN: ${{ secrets.LIVE_DISCORD_TOKEN }}
          GUILDSMITH_GUILDS: ${{ secrets.LIVE_GUILD_ID }}
          # 002: a second, empty server for the server-as-code copy, test accounts to ban and
          # unban, and a public template to import. Each test skips when its value is unset.
          GUILDSMITH_LIVE_EMPTY: ${{ secrets.LIVE_EMPTY_GUILD_ID }}
          GUILDSMITH_LIVE_ALTS: ${{ secrets.LIVE_ALT_IDS }}
          GUILDSMITH_LIVE_TEMPLATE: ${{ vars.LIVE_TEMPLATE_CODE }}
        run: cargo test -p guildsmith --test live -- --test-threads=1
