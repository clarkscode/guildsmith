# Publishes the npm packages (research R15, ADR-002): one @guildsmith/<platform> package per dist
# target, then the `guildsmith` launcher that lists them as optionalDependencies.
#
# Called by release.yml (dist `publish-jobs = ["./publish-npm"]`) after the dist build. The job
# runs in the `release` environment, so it waits for a manual approval and only that environment
# holds NPM_TOKEN (docs/release.md).
name: Publish npm

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  npm:
    runs-on: ubuntu-22.04
    environment: release
    # Permissions come from the calling job in release.yml (id-token: write, for npm provenance).
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Fetch dist artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Stage packages
        run: cargo xtask npm-pack target/distrib --out target/npm
      - name: Publish (platform packages first)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 guildsmith; do
            pkg="target/npm/$dir"
            spec="$(node -p "const p = require('./$pkg/package.json'); p.name + '@' + p.version")"
            # Re-running after a partial failure skips what is already on the registry.
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already published; skipping"
              continue
            fi
            npm publish "$pkg" --access public --provenance
          done
