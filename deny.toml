# cargo-deny configuration. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Informational: these crates were merged into zbus 6.0. We only get them through
    # keyring 4's Linux secret-service store (keyring → secret-service → zbus 5); there is no
    # patched version. Drop these once keyring's store moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; pulled in by keyring's zbus 5 store" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; pulled in by keyring's zbus 5 store" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; pulled in by keyring's zbus 5 store" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Reserved for a twilight git pin inside guildsmith-discord, which needs an ADR (research R2).
allow-git = []
