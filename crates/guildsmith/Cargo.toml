[package]
name = "guildsmith"
description = "Fast MCP server and CLI for building and managing Discord servers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["discord", "mcp", "cli", "infrastructure-as-code"]
categories = ["command-line-utilities"]

[[bin]]
name = "guildsmith"
path = "src/main.rs"

# Opt-in live tests against a real test server (GUILDSMITH_LIVE_TEST=1).
[[test]]
name = "live"
path = "../../tests/live/main.rs"

[features]
default = ["keyring"]
keyring = ["guildsmith-app/keyring"]

[dependencies]
guildsmith-core.workspace = true
guildsmith-app.workspace = true
guildsmith-discord.workspace = true
guildsmith-mcp.workspace = true
clap.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
serde.workspace = true
rpassword.workspace = true

[dev-dependencies]
guildsmith-app = { workspace = true, features = ["fake"] }
insta.workspace = true
rmcp = { workspace = true, features = ["client"] }
wiremock.workspace = true

[lints]
workspace = true
